openapi: 3.0.3
info:
  title: Alexandria - Recomendações diárias
  version: 1.0.0
  description: Contrato proposto; seleção de até 30 livros, uma publicação por leitor/dia.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /recommendations:
    get:
      operationId: getDailyRecommendations
      summary: Consultar seleção pronta com exclusões atuais
      description: |
        Usuário exclusivamente do JWT. Sem userId, cursor ou parâmetros de paginação.
        Retorna até 30 livros da seleção atual; jamais calcula substitutos no GET.
        A precedência é READY de hoje (mesmo vazia), depois verificação do perfil
        se não houver READY de hoje, e somente depois fallback da seleção anterior.
        Sem READY de hoje e sem sinais positivos: EMPTY/NO_PROFILE, selection null,
        items vazio, sem geração e sem STALE. Com sinais positivos, solicita/retoma
        a geração e pode usar seleção anterior STALE, filtrada pela biblioteca atual.
        READY de hoje não é invalidada por mudança intradiária do perfil.
        Navegar/recarregar não reconstrói uma seleção READY do dia.
      responses:
        '200':
          description: Seleção READY, estado EMPTY ou seleção anterior STALE.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
              examples:
                empty:
                  value:
                    state: EMPTY
                    selection: null
                    items: []
                    emptyReason: NO_PROFILE
                    updatePending: false
                    retryAfterSeconds: null
                    message: Adicione livros à biblioteca para formar seu perfil de leitura.
        '202':
          description: Primeira seleção do dia em geração e sem seleção anterior.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
            Retry-After:
              schema: { type: integer, minimum: 1, example: 3 }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '401':
          description: Sem autenticação válida; formato do corpo não garantido pelo entry point atual.
        '503':
          description: Geração indisponível/falhou sem seleção anterior; não significa biblioteca vazia.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /recommendations/generation:
    post:
      operationId: requestDailyRecommendationGeneration
      summary: Solicitar primeira geração ou retomar falha do dia
      description: |
        Sem corpo e sem userId. Ação idempotente quanto à publicação diária.
        READY de hoje tem precedência, inclusive se o perfil mudou depois. Sem READY
        de hoje e sem sinal positivo, responde NO_PROFILE sem fallback ou ranking.
        Não substitui READY nem altera data de referência. Pedido enquanto BUILDING
        reutiliza a mesma geração. Retry manual respeita backoff de 60 segundos;
        pode retomar falha após esgotar tentativas automáticas. Não gera substitutos
        para uma seleção READY vazia ou cujos livros foram adicionados.
      responses:
        '200':
          description: Seleção do dia já está pronta, ou não há perfil positivo para gerar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationResponse' }
        '202':
          description: Geração aceita ou já em andamento.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1, example: 3 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationResponse' }
        '401':
          description: Sem autenticação válida; não assumir formato fixo de erro.
        '429':
          description: Retry manual antes do backoff permitido.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Fila indisponível; permitir retry sem perder última seleção.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RecommendationResponse:
      type: object
      additionalProperties: false
      required: [state, selection, items, emptyReason, updatePending, retryAfterSeconds, message]
      properties:
        state:
          type: string
          enum: [READY, EMPTY, STALE, GENERATING]
        selection:
          $ref: '#/components/schemas/Selection'
        items:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/RecommendationItem' }
        emptyReason:
          type: string
          nullable: true
          enum: [NO_PROFILE, NO_MATCHES, ALL_ADDED_OR_UNAVAILABLE, null]
        updatePending: { type: boolean }
        retryAfterSeconds: { type: integer, minimum: 1, nullable: true }
        message: { type: string, nullable: true }
    Selection:
      type: object
      nullable: true
      additionalProperties: false
      required: [id, referenceDate, generatedAt, algorithmVersion, selectedCount]
      properties:
        id: { type: integer, format: int64 }
        referenceDate: { type: string, format: date }
        generatedAt: { type: string, format: date-time }
        algorithmVersion: { type: string, example: content-v1 }
        selectedCount:
          type: integer
          minimum: 0
          maximum: 30
          description: Quantidade original; items pode ser menor após exclusões atuais.
    RecommendationItem:
      type: object
      additionalProperties: false
      required: [position, book, reason]
      properties:
        position: { type: integer, minimum: 1, maximum: 30 }
        book: { $ref: '#/components/schemas/RecommendedBook' }
        reason: { $ref: '#/components/schemas/Reason' }
    RecommendedBook:
      type: object
      additionalProperties: false
      required: [id, title, authors, coverUrl]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        authors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
        coverUrl: { type: string, nullable: true }
    Reason:
      type: object
      additionalProperties: false
      required: [type, matchedValue, text]
      properties:
        type: { type: string, enum: [SUBJECT, AUTHOR] }
        matchedValue: { type: string }
        text:
          type: string
          description: Evidência positiva da biblioteca do próprio leitor na data da seleção.
    GenerationResponse:
      type: object
      additionalProperties: false
      required: [state, referenceDate]
      properties:
        state: { type: string, enum: [ACCEPTED, ALREADY_RUNNING, READY, NO_PROFILE] }
        referenceDate: { type: string, format: date }
    ErrorResponse:
      type: object
      required: [message, status, timestamp]
      properties:
        message: { type: string }
        status: { type: integer }
        timestamp:
          type: string
          description: LocalDateTime no padrão atual de ErrorResponse, sem exigir offset UTC.
