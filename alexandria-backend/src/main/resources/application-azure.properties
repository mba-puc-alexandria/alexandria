# Profile especifico para Azure
spring.application.name=alexandria

# Banco de dados - Azure MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true

# JWT - usar Azure Key Vault ou variaveis de ambiente
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Atuador/Health check (importante para o App Service)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Swagger (ajuste o path se quiser)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
