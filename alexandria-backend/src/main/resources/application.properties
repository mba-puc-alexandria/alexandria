spring.application.name=alexandria
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:alexandriadb}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.data.web.pageable.max-page-size=100
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://192.168.0.10:3000,https://bibliotecaalexandria.com.br}
google.client-id=${GOOGLE_CLIENT_ID:585326352858-p23r7po387fmga55vbv5hjqf26ah35db.apps.googleusercontent.com}
payment-api.url=${PAYMENT_API_URL:http://localhost:8082}
subscription.callback-secret=${SUBSCRIPTION_CALLBACK_SECRET}

# Agente de atendimento: provedor do modelo (ollama em dev, bedrock-converse em prod)
spring.ai.model.chat=${AI_PROVIDER:ollama}
spring.ai.model.embedding=none
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:qwen2.5:3b}
spring.ai.ollama.chat.options.temperature=0.3
spring.ai.ollama.init.pull-model-strategy=${OLLAMA_PULL_STRATEGY:never}
spring.ai.ollama.init.timeout=30m
spring.ai.bedrock.aws.region=${AWS_REGION:us-east-2}
spring.ai.bedrock.converse.chat.options.model=${BEDROCK_MODEL_ID:us.anthropic.claude-haiku-4-5-20251001-v1:0}
spring.ai.bedrock.converse.chat.options.max-tokens=1024

# Daily recommendations: data identity uses this zone; leases use database UTC.
recommendations.zone=America/Sao_Paulo
recommendations.cron=0 0 0 * * *
recommendations.recovery-delay-ms=300000
recommendations.metrics-delay-ms=300000
recommendations.retention-delay-ms=3600000
recommendations.lease=5m
recommendations.heartbeat=60s
recommendations.workers=2
recommendations.queue-capacity=100
recommendations.page-size=100
recommendations.overdue-threshold=60m
recommendations.jobs-enabled=${RECOMMENDATIONS_JOBS_ENABLED:true}
