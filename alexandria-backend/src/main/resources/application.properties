spring.application.name=alexandria
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:alexandriadb}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.data.web.pageable.max-page-size=100
spring.flyway.enabled=false
jwt.secret=${JWT_SECRET:dev-secret-key-not-for-production-min-256bits}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
