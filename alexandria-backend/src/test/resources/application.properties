spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

# JWT
jwt.secret=test-secret-key-for-tests-min-256-bits
jwt.expiration-ms=86400000

# Google OAuth (test)
google.client-id=test-google-client-id

# Subscription / Payment API
payment-api.url=http://localhost:8082
subscription.trial-days=15
subscription.price=10.00
subscription.period-days=30
subscription.currency=BRL
subscription.callback-secret=test-callback-secret
