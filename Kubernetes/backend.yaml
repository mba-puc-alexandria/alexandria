apiVersion: apps/v1
kind: Deployment
metadata:
  name: alexandria-backend
  namespace: alexandria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alexandria-backend
  template:
    metadata:
      labels:
        app: alexandria-backend
    spec:
      containers:
        - name: alexandria-backend
          # O pipeline substitui esta imagem local por uma tag SHA.
          image: alexandriabackend:1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: alexandriadb
            - name: DB_USER
              value: alexandria
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: core-secrets
                  key: mysql-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: core-secrets
                  key: jwt-secret
            - name: PAYMENT_API_URL
              value: http://payment-api:8082
            - name: SUBSCRIPTION_CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: core-secrets
                  key: callback-secret
            - name: CORS_ALLOWED_ORIGINS
              value: https://k8s.bibliotecaalexandria.com.br
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
