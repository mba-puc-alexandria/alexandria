apiVersion: apps/v1
kind: Deployment
metadata:
  name: alexandria-frontend
  namespace: alexandria
  labels:
    app: alexandria-frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: alexandria-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 2
  template:
    metadata:
      labels:
        app: alexandria-frontend
    spec:
      containers:
        - name: alexandria-frontend
          image: alexandriafrontend:1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 5
---

