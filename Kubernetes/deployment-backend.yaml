apiVersion: apps/v1
kind: Deployment
metadata:
  name: alexandria-backend
  namespace: alexandria
  labels:
    app: alexandria-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alexandria-backend
  template:
    metadata:
      labels:
        app: alexandria-backend
    spec:
      containers:
        - name: alexandria-backend
          # O pipeline substitui esta imagem por uma tag SHA do seu registry.
          image: alexandriabackend:1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: alexandriadb
            - name: DB_USER
              value: alexandria
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: core-secrets
                  key: mysql-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: core-secrets
                  key: jwt-secret
            - name: SUBSCRIPTION_CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: core-secrets
                  key: callback-secret
            - name: PAYMENT_API_URL
              value: http://payment-api:8082
            # Mesma origem do frontend (Ingress em host único).
            - name: CORS_ALLOWED_ORIGINS
              value: https://k8s.bibliotecaalexandria.com.br
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          # Flyway + Hibernate podem demorar no primeiro boot.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            failureThreshold: 3
---

