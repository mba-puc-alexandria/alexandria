# Requer um Ingress Controller NGINX (ingress-nginx) instalado no cluster.
# Host único: o navegador acessa frontend e backend na mesma origem,
# então NEXT_PUBLIC_API_URL deve ser https://k8s.bibliotecaalexandria.com.br
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alexandria
  namespace: alexandria
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    # Descomente se usar cert-manager para emitir o certificado TLS:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - k8s.bibliotecaalexandria.com.br
      secretName: alexandria-tls
  rules:
    - host: k8s.bibliotecaalexandria.com.br
      http:
        paths:
          # --- Backend (Spring Boot) ---
          - path: /auth
            pathType: Prefix
            backend:
              service: { name: alexandria-backend, port: { number: 8080 } }
          - path: /books
            pathType: Prefix
            backend:
              service: { name: alexandria-backend, port: { number: 8080 } }
          - path: /user-books
            pathType: Prefix
            backend:
              service: { name: alexandria-backend, port: { number: 8080 } }
          - path: /profile
            pathType: Prefix
            backend:
              service: { name: alexandria-backend, port: { number: 8080 } }
          - path: /subscriptions
            pathType: Prefix
            backend:
              service: { name: alexandria-backend, port: { number: 8080 } }
          - path: /api/jobs
            pathType: Prefix
            backend:
              service: { name: alexandria-backend, port: { number: 8080 } }
          # --- Frontend (Next.js): todo o resto, incluindo /api/epub ---
          - path: /
            pathType: Prefix
            backend:
              service: { name: alexandria-frontend, port: { number: 3000 } }
