apiVersion: apps/v1
kind: Deployment
metadata:
  name: alexandria-frontend
  namespace: alexandria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alexandria-frontend
  template:
    metadata:
      labels:
        app: alexandria-frontend
    spec:
      containers:
        - name: alexandria-frontend
          # O pipeline substitui esta imagem local por uma tag SHA.
          image: alexandriafrontend:1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
