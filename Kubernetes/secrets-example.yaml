# EXEMPLO - NÃO versionar com valores reais.
# Crie o Secret direto no cluster, por exemplo:
#   kubectl -n alexandria create secret generic core-secrets \
#     --from-literal=mysql-password='<senha>' \
#     --from-literal=mysql-root-password='<senha-root>' \
#     --from-literal=jwt-secret='<mínimo 256 bits>' \
#     --from-literal=callback-secret='<segredo do webhook>'
apiVersion: v1
kind: Secret
metadata:
  name: core-secrets
  namespace: alexandria
type: Opaque
stringData:
  mysql-password: "troque-me"
  mysql-root-password: "troque-me-root"
  jwt-secret: "troque-me-chave-com-no-minimo-256-bits-0123456789"
  callback-secret: "troque-me-callback"
