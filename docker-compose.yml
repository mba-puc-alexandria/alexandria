services:
  mysql:
    image: mysql:8.0.32
    container_name: alexandria-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: alexandria123
      MYSQL_DATABASE: alexandriadb
      MYSQL_USER: alexandria
      MYSQL_PASSWORD: alexandria123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./alexandria-backend
      dockerfile: Dockerfile
    container_name: alexandria-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/alexandriadb
      SPRING_DATASOURCE_USERNAME: alexandria
      SPRING_DATASOURCE_PASSWORD: alexandria123
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Mesma chave JWT do payment-api (para validar o token repassado no checkout).
      JWT_SECRET: dev-secret-key-not-for-production-min-256bits
      # Integração com o payment-api (rodando à parte). host.docker.internal
      # aponta para o host quando o backend roda dentro do container.
      PAYMENT_API_URL: http://host.docker.internal:8082
      SUBSCRIPTION_CALLBACK_SECRET: dev-callback-secret
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./alexandria-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: alexandria-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  mysql_data:
