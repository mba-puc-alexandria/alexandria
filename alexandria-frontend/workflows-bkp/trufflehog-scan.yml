name: TruffleHog Scan Test

on:
  pull_request:
    branches:
      - main

jobs:
  trufflehog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up TruffleHog
        run: |
          docker pull trufflesecurity/trufflehog:latest

      - name: Run TruffleHog
        id: trufflehog_outputs
        run: |
          output=$(docker run --rm -v "$PWD:/temp" trufflesecurity/trufflehog:latest github --repo https://github.com/${{ github.repository }})
          echo "trufflehog_output=$(echo "$output" | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Create Issue
        run: |
          echo "$trufflehog_output"
          if [[ "$trufflehog_output" == *"Found unverified secret"* || "$trufflehog_output" == *"Found verified result"* ]]; then

            info=$(echo "$trufflehog_output" | grep -oP '(?<=Commit:).*')
            issue_body="Secrets encontradas pelo TruffleHog, com as seguintes informações:\n $info"

            curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.ACCESS_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/mba-puc-alexandria/alexandria/issues" \
              -d "{\"title\":\"Trufflehog Found a secret\",\"body\":\"$issue_body\",\"labels\":[\"bug\"]}"
            exit 1
          fi
        env:
          trufflehog_output: ${{ steps.trufflehog_outputs.outputs.trufflehog_output }}
