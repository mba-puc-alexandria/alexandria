name: Deploy AWS

# Alterado: antes rodava em pull_request (deploy em produção antes de review/merge,
# com risco de expor secrets a qualquer branch do repo). Agora roda só após o
# merge em main.
on:
  push:
    branches:
      - main

# Evita que dois deploys rodem ao mesmo tempo na mesma EC2 (mesmos nomes de
# container, mesma porta) caso haja pushes muito próximos em main.
concurrency:
  group: deploy-aws-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Opcional: se você configurar um Environment "production" no repo com
    # required reviewers, descomente a linha abaixo para exigir aprovação
    # manual antes do deploy.
    # environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # Tag com o SHA do commit, além de "latest", para permitir rollback
      # (docker run com uma tag antiga) se um deploy quebrar algo.
      - name: Build Backend Docker Image
        run: |
          docker build -t alexandria-backend:${{ github.sha }} -t alexandria-backend:latest ./alexandria-backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t alexandria-frontend:${{ github.sha }} -t alexandria-frontend:latest \
            --build-arg NEXT_PUBLIC_API_URL=https://api.bibliotecaalexandria.com.br \
            ./alexandria-frontend

      - name: Salvar imagens
        run: |
          docker save alexandria-backend:${{ github.sha }} alexandria-backend:latest | gzip > /tmp/backend.tar.gz
          docker save alexandria-frontend:${{ github.sha }} alexandria-frontend:latest | gzip > /tmp/frontend.tar.gz

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copiar imagens para EC2
        run: |
          scp -i ~/.ssh/ec2_key /tmp/backend.tar.gz ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/
          scp -i ~/.ssh/ec2_key /tmp/frontend.tar.gz ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/

      - name: Limpar disco na EC2 antes do deploy
        uses: docs/example-action@b16d2601a6b948e2fb26f3772276581f31daa7cd
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "Limpando disco antes do deploy..."
            # Removido --volumes: apagava volumes nomeados não usados no
            # momento, com risco real de perda de dados (ex.: volume do RDS
            # proxy, cache, etc). Continua limpando imagens/containers/redes
            # não usados, que é o que realmente ocupa espaço aqui.
            sudo docker system prune -af || true
            echo "Espaco em disco:"
            df -h /

      - name: Deploy Backend na EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            echo "Carregando imagem do backend..."
            gunzip -c /tmp/backend.tar.gz | docker load
            echo "Atualizando codigo..."
            cd ~/app/alexandria
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            echo "Subindo container..."
            docker rm -f alexandria-backend 2>/dev/null || true
            CONTAINER_ID=$(docker run -d \
              --name alexandria-backend \
              --restart unless-stopped \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=rds \
              -e DB_HOST=alexandria-db.c9qs2asg26uk.us-east-2.rds.amazonaws.com \
              -e DB_PORT=3306 \
              -e DB_NAME=alexandriadb \
              -e DB_USER=admin \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e CORS_ALLOWED_ORIGINS=https://bibliotecaalexandria.com.br,https://api.bibliotecaalexandria.com.br \
              alexandria-backend:${{ github.sha }})
            echo "Container ID: $CONTAINER_ID"
            sleep 5
            STATUS=$(docker inspect --format '{{.State.Status}}' alexandria-backend 2>/dev/null || echo "not_found")
            echo "Status do container: $STATUS"
            if [ "$STATUS" != "running" ]; then
              echo "Container nao esta rodando! Coletando logs..."
              docker logs alexandria-backend 2>&1 || true
              exit 1
            fi
            echo "Container esta rodando! Aguardando aplicacao subir..."

      - name: Aguardar Backend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            echo "Aguardando backend subir..."
            for i in $(seq 1 36); do
              sleep 10
              if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "Backend no ar!"
                break
              fi
              if [ "$i" -eq 36 ]; then
                echo "Backend nao subiu a tempo! Coletando logs para diagnostico..."
                echo "=== docker ps ==="
                docker ps -a --filter name=alexandria-backend
                echo "=== docker logs alexandria-backend ==="
                docker logs alexandria-backend 2>&1 || echo "Container nao encontrado ou sem logs"
                echo "=== docker inspect alexandria-backend ==="
                docker inspect alexandria-backend --format '{{.State.Status}} {{.State.ExitCode}} {{.State.Error}}' 2>/dev/null || echo "Container nao encontrado"
                exit 1
              fi
              echo "Tentativa $i/36..."
            done

      - name: Deploy Frontend na EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            echo "Carregando imagem do frontend..."
            gunzip -c /tmp/frontend.tar.gz | docker load
            echo "Subindo container..."
            docker rm -f alexandria-frontend 2>/dev/null || true
            docker run -d \
              --name alexandria-frontend \
              --restart unless-stopped \
              -p 80:3000 \
              alexandria-frontend:${{ github.sha }}
            echo "Aguardando frontend subir..."
            for i in $(seq 1 12); do
              sleep 5
              if curl -sf http://localhost:80 > /dev/null 2>&1; then
                echo "Frontend no ar!"
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "Frontend nao respondeu a tempo! Coletando logs..."
                docker logs alexandria-frontend 2>&1 || true
                exit 1
              fi
            done

      # Roda mesmo se algum step anterior falhar, para não deixar lixo
      # acumulando na EC2 a cada tentativa de deploy.
      - name: Limpar arquivos temporarios na EC2
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 2m
          script: |
            rm -f /tmp/backend.tar.gz /tmp/frontend.tar.gz