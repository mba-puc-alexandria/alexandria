name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish-feature:
    name: Build, Scan e Publicação — Feature
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'feature/')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: feature

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout no commit aprovado pelo CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Metadata Backend
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/anga-backend
          tags: |
            type=raw,value=feature
            type=sha

      - name: Metadata Frontend
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/alexandria-frontend
          tags: |
            type=raw,value=feature
            type=sha

      - name: Build e push — Backend
        uses: docker/build-push-action@v5
        with:
          context: ./alexandria-backend/backend
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}

      - name: Build e push — Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./aalexandria-frontend
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}

  publish-development:
    name: Build, Scan e Publicação — Development
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: development

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout no commit aprovado pelo CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Metadata Backend
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/analexandria-backend
          tags: |
            type=raw,value=develop
            type=sha

      - name: Metadata Frontend
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/alexandria-frontend
          tags: |
            type=raw,value=develop
            type=sha

      - name: Build e push — Backend
        uses: docker/build-push-action@v5
        with:
          context: ./alexandria-backend/backend
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}

      - name: Build e push — Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./alexandria-frontend
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}

  publish-production:
    name: Build, Scan e Publicação — Production
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout no commit aprovado pelo CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Metadata Backend
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/anga-backend
          tags: |
            type=raw,value=latest
            type=raw,value=stable
            type=sha

      - name: Metadata Frontend
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/alexandria-frontend
          tags: |
            type=raw,value=latest
            type=raw,value=stable
            type=sha

      - name: Build e push — Backend
        uses: docker/build-push-action@v5
        with:
          context: ./alexandria-backend/backend
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}

      - name: Build e push — Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./alexandria-frontend
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}

      - name: Scan Backend image com Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/alexandria-backend:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Scan Frontend image com Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/anga-frontend:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1