name: TruffleHog Scan Test

on: 
  pull_request:
    branches:
      - main

jobs:
  truffehog:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up TruffleHog
      run: | 
            docker pull  trufflesecurity/trufflehog:latest

    - name: Run TruffleHog
      run: |
            docker run --rm -v "$PWD:/temp" trufflesecurity/trufflehog:latest github --org=mba-puc-alexandria

    - name: Create Issue
      run: | 
        curl -L \
         -X POST \
         -H "Accept: application/vnd.github+json" \
         -H "Authorization: Bearer ${{ secrets.ACCESS_TOKEN }}" \
         -H "X-GitHub-Api-Version: 2026-03-10" \
          https://api.github.com/repos/mba-puc-alexandria/alexandria/issues \
          -d '{"title":"Trufflehog Found a secret","body":"I'\''m having a problem with this.","assignees":["octocat"],"milestone":1,"labels":["bug"]}'
           
