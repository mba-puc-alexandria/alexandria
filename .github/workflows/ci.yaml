name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches:
      - develop
      - main
      - 'feature/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Guardrails — Política de Branch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validar política de branches
        shell: bash
        run: |
          set -e

          EVENT="${GITHUB_EVENT_NAME}"
          REF_NAME="${GITHUB_REF_NAME}"
          HEAD_REF="${GITHUB_HEAD_REF}"
          BASE_REF="${GITHUB_BASE_REF}"

          echo "Event: $EVENT"
          echo "Ref name: $REF_NAME"
          echo "Head ref: $HEAD_REF"
          echo "Base ref: $BASE_REF"

          # PR para develop → só feature/*
          if [[ "$EVENT" == "pull_request" && "$BASE_REF" == "develop" ]]; then
            if [[ "$HEAD_REF" != feature/* ]]; then
              echo "::error title=Regra violada::PR para 'develop' deve vir de uma branch feature/* . Branch atual: '$HEAD_REF'."
              exit 1
            fi
            echo "::notice title=Fluxo válido::PR vindo de feature/* para develop."
            exit 0
          fi

          # PR para main → só develop
          if [[ "$EVENT" == "pull_request" && "$BASE_REF" == "main" ]]; then
            if [[ "$HEAD_REF" != "develop" ]]; then
              echo "::error title=Regra violada::PR para 'main' deve vir da branch 'develop'. Branch atual: '$HEAD_REF'."
              exit 1
            fi
            echo "::notice title=Fluxo válido::PR vindo de develop para main."
            exit 0
          fi

          # Push em feature/* é permitido
          if [[ "$EVENT" == "push" && "$REF_NAME" == feature/* ]]; then
            echo "::notice title=Fluxo válido::Push em branch feature detectado."
            exit 0
          fi

          # Push em develop/main passa porque pode ser merge legítimo
          if [[ "$EVENT" == "push" && ( "$REF_NAME" == "develop" || "$REF_NAME" == "main" ) ]]; then
            echo "::warning title=Push em branch principal::Esse push pode ser resultado de merge. O bloqueio real de push direto depende de branch protection no GitHub."
            exit 0
          fi

          # Qualquer outra branch fora do padrão
          if [[ "$EVENT" == "push" ]]; then
            echo "::error title=Branch fora do padrão::Use branches feature/* para desenvolvimento."
            exit 1
          fi

          echo "::notice title=Sem ação::Evento fora da política principal."

  backend:
    name: Backend — Build, Test & Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: guardrails

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: alexandria_test
          POSTGRES_USER: alexandria
          POSTGRES_PASSWORD: alexandria123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analexandria -d alexandria_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar arquivo de teste
        working-directory: alexandria-backend/
        run: |
          echo "=== Conteudo do application-test.yml ==="
          cat src/test/resources/application-test.yml || echo "ARQUIVO NAO ENCONTRADO"
          echo "=== Listando src/test/resources ==="
          ls -la src/test/resources/ || echo "PASTA NAO EXISTE"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permissão ao Maven Wrapper
        working-directory: alexandria-backend/
        run: chmod +x mvnw

      - name: Build e testes
        working-directory: alexandria-backend/
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/alexandria_test
          SPRING_DATASOURCE_USERNAME: alexandria
          SPRING_DATASOURCE_PASSWORD: alexandria123
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          JWT_SECRET: ${{ secrets.JWT_SECRET_CI }}
        run: ./mvnw clean verify
      - name: Upload relatórios backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            anga-backend/backend/target/surefire-reports/
            anga-backend/backend/target/failsafe-reports/
            anga-backend/backend/target/*.jar
          retention-days: 7

  frontend:
    name: Frontend — Lint, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: guardrails

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: alexandria-frontend/package-lock.json

      - name: Instalar dependências
        working-directory: alexandria-frontend
        run: npm ci

      - name: Lint
        working-directory: alexandria-frontend
        run: npm run lint

      - name: Test
        working-directory: alexandria-frontend
        run: npm run test -- --runInBand
        continue-on-error: true

      - name: Build
        working-directory: alexandria-frontend
        run: npm run build

      - name: Upload build frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: alexandria-frontend/dist/
          retention-days: 7

  integration:
    name: Integração — Docker Compose + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [guardrails, backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: alexandria-frontend/package-lock.json

      - name: Instalar dependências frontend
        working-directory: alexandria-frontend
        run: npm ci

      - name: Instalar Playwright
        working-directory: alexandria-frontend
        run: npx playwright install --with-deps

      - name: Subir stack
        env:
          OPENAI_API_KEY: dummy
          ANTHROPIC_API_KEY: dummy
          JWT_SECRET: 12345678901234567890123456789012
        run: docker compose -f docker-compose.ci.yml up -d --build

      - name: Aguardar backend ficar pronto
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8080/actuator/health; then
              echo "Backend pronto"
              exit 0
            fi
            sleep 2
          done
          echo "Backend não subiu a tempo"
          docker compose -f docker-compose.ci.yml logs
          exit 1
      - name: Debug - Testar login manualmente
        run: |
          echo "=== Testando acesso ao backend ==="
          curl -f http://localhost:8080/actuator/health -v

          echo -e "\n=== Testando login ==="
          curl -X POST http://localhost:8080/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"danilo@anga.com","password":"123456"}' \
            -v

          echo -e "\n=== Logs do Docker ==="
          docker compose -f docker-compose.ci.yml logs backend | tail -50
      - name: Criar usuário de teste
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:8080/auth/register \
            -H "Content-Type: application/json" \
            -d '{
              "email": "tamiris@alexandria.com",
              "password": "123456",
              "name": "Tamiris Test",
              "role": "USER"
            }')
          echo "Resposta: $RESPONSE"
      - name: Testar login manualmente
        run: |
          curl -X POST http://localhost:8080/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"tamiris@alexandria.com","password":"123456"}' \
            -v
      - name: Validar frontend
        run: |
          # Se teu docker-compose expõe o front em outra porta, ajusta aqui.
          curl -f http://localhost

      - name: Rodar testes E2E
        working-directory: alexandria-frontend
        run: npx playwright test

      - name: Logs em caso de falha
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs

      - name: Derrubar stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v