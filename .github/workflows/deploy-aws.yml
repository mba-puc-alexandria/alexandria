name: Deploy AWS

on:
  push:
    branches: [ develop, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # =============================================
      # BUILD DAS IMAGENS (no GitHub, mais rápido)
      # =============================================
      - name: Build Backend Docker Image
        run: |
          docker build -t alexandria-backend ./alexandria-backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t alexandria-frontend ./alexandria-frontend

      # =============================================
      # DEPLOY DO BACKEND na EC2
      # =============================================
      - name: Enviar e Rodar Backend
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          echo "🚀 Enviando imagem do backend..."
          docker save alexandria-backend | gzip | ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "gunzip | docker load && \
             cd ~/app/alexandria && \
             git checkout ${{ github.ref_name }} && \
             git pull origin ${{ github.ref_name }} && \
             docker rm -f alexandria-backend 2>/dev/null || true && \
             docker run -d \
               --name alexandria-backend \
               --restart unless-stopped \
               -p 8080:8080 \
               -e SPRING_PROFILES_ACTIVE=rds \
               -e DB_HOST=alexandria-db.c9qs2asg26uk.us-east-2.rds.amazonaws.com \
               -e DB_PORT=3306 \
               -e DB_NAME=alexandriadb \
               -e DB_USER=admin \
               -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
               -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
               alexandria-backend && \
             echo '✅ Backend enviado e rodando!'"

      - name: Aguardar Backend ficar saudável
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            echo "⏳ Aguardando backend subir..."
            for i in $(seq 1 12); do
              sleep 5
              if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "✅ Backend no ar!"
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "❌ Backend não subiu a tempo!"
                exit 1
              fi
              echo "Tentativa $i/12 - aguardando backend..."
            done

      # =============================================
      # DEPLOY DO FRONTEND na EC2
      # =============================================
      - name: Enviar e Rodar Frontend
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          echo "🚀 Enviando imagem do frontend..."
          docker save alexandria-frontend | gzip | ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "gunzip | docker load && \
             docker rm -f alexandria-frontend 2>/dev/null || true && \
             docker run -d \
               --name alexandria-frontend \
               --restart unless-stopped \
               -p 80:3000 \
               -e NEXT_PUBLIC_API_URL=http://localhost:8080 \
               alexandria-frontend && \
             echo '✅ Frontend no ar!'"
