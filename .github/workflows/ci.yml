# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  checks: write        # necessário para o dorny/test-reporter criar o check run
  pull-requests: write  # opcional, só se quiser comentários no PR

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alexandria-backend   # aplica a todos os steps do job

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: alexandria-backend/pom.xml   # importante para o cache funcionar certo

      - name: Build com Maven
        run: mvn -B clean compile

      - name: Rodar testes
        run: mvn -B test

      - name: Gerar relatório de cobertura (Jacoco)
        run: mvn -B jacoco:report

      - name: Publicar resultados dos testes
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Resultados dos Testes
          path: 'alexandria-backend/target/surefire-reports/*.xml'   # caminho também precisa do prefixo
          reporter: java-junit

      - name: Empacotar aplicação
        run: mvn -B package -DskipTests

      - name: Upload do artefato JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: alexandria-backend/target/*.jar   # idem
