name: Alexandria CI
 
on:
  push:
    branches: [main]
  pull_request:
 
env:
  JWT_SECRET: ${{ secrets.JWT_SECRET || 'dev-secret-key-not-for-production-min-256bits' }}
  SUBSCRIPTION_CALLBACK_SECRET: ${{ secrets.SUBSCRIPTION_CALLBACK_SECRET || 'dev-callback-secret' }}
  MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
  MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
  MERCADOPAGO_ENVIRONMENT: ${{ vars.MERCADOPAGO_ENVIRONMENT || 'sandbox' }}
  NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY }}
 
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
 
    # Equivalentes a: postgres-payment e mysql
    # O job roda direto no runner, então os serviços ficam em localhost:<porta>
    services:
      postgres-payment:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: paymentdb
          POSTGRES_USER: paymentapi
          POSTGRES_PASSWORD: paymentapi123
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U paymentapi -d paymentdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
 
      mysql:
        image: mysql:8.0.32
        env:
          MYSQL_ROOT_PASSWORD: alexandria123
          MYSQL_DATABASE: alexandriadb
          MYSQL_USER: alexandria
          MYSQL_PASSWORD: alexandria123
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -palexandria123 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
 
    steps:
      - name: Checkout deste repositório
        uses: actions/checkout@v4
 
      # No compose o contexto era ../deliveryAPI/payment-api (outro repo, ao lado).
      # Aqui ele é clonado dentro do workspace, em ./deliveryAPI
      - name: Checkout deliveryAPI
        uses: actions/checkout@v4
        with:
          repository: SEU_USUARIO/deliveryAPI # <- ajuste
          path: deliveryAPI
          token: ${{ secrets.DELIVERY_API_TOKEN || github.token }} # PAT se o repo for privado
 
      - name: Build das imagens
        run: |
          docker build -t payment-api ./deliveryAPI/payment-api
          docker build -t alexandria-backend ./alexandria-backend
          docker build -t alexandria-frontend \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8080 \
            --build-arg NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY="$NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY" \
            ./alexandria-frontend
 
      # --network host: os containers enxergam os services em localhost
      # e enxergam uns aos outros em localhost (substitui os hosts "backend", "payment-api" etc.)
      - name: Subir payment-api
        run: |
          docker run -d --name payment-api --network host \
            -e SPRING_PROFILES_ACTIVE=docker \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5434/paymentdb \
            -e SPRING_DATASOURCE_USERNAME=paymentapi \
            -e SPRING_DATASOURCE_PASSWORD=paymentapi123 \
            -e JWT_SECRET \
            -e PAYMENT_KAFKA_ENABLED=false \
            -e PAYMENT_CALLBACK_URL=http://localhost:8080/subscriptions/payment-webhook \
            -e SUBSCRIPTION_CALLBACK_SECRET \
            -e MERCADOPAGO_ACCESS_TOKEN \
            -e MERCADOPAGO_PUBLIC_KEY="$NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY" \
            -e MERCADOPAGO_WEBHOOK_SECRET \
            -e MERCADOPAGO_ENVIRONMENT \
            payment-api
 
      - name: Aguardar payment-api
        run: |
          timeout 180 bash -c 'until curl -s -o /dev/null http://localhost:8082; do sleep 3; done' \
            || { docker logs payment-api; exit 1; }
 
      - name: Subir backend
        run: |
          docker run -d --name alexandria-backend --network host \
            -e SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/alexandriadb \
            -e SPRING_DATASOURCE_USERNAME=alexandria \
            -e SPRING_DATASOURCE_PASSWORD=alexandria123 \
            -e CORS_ALLOWED_ORIGINS=http://localhost:3000 \
            -e JWT_SECRET \
            -e PAYMENT_API_URL=http://localhost:8082 \
            -e SUBSCRIPTION_CALLBACK_SECRET \
            alexandria-backend
 
      - name: Aguardar backend
        run: |
          timeout 180 bash -c 'until curl -s -o /dev/null http://localhost:8080; do sleep 3; done' \
            || { docker logs alexandria-backend; exit 1; }
 
      - name: Subir frontend
        run: docker run -d --name alexandria-frontend --network host alexandria-frontend
 
      - name: Aguardar frontend
        run: |
          timeout 120 bash -c 'until curl -s -o /dev/null http://localhost:3000; do sleep 3; done' \
            || { docker logs alexandria-frontend; exit 1; }
 
      # Troque por seus testes reais (Playwright, Cypress, Newman, etc.)
      - name: Smoke test
        run: |
          curl -sf http://localhost:3000 > /dev/null
          echo "Stack no ar"
 
      - name: Logs dos containers em caso de falha
        if: failure()
        run: |
          for c in payment-api alexandria-backend alexandria-frontend; do
            echo "::group::$c"
            docker logs "$c" 2>&1 | tail -n 200 || true
            echo "::endgroup::"
          done
 