# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alexandria-backend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: alexandria-backend/pom.xml

      - name: Build com Maven
        run: mvn -B clean compile

      - name: Rodar testes
        run: mvn -B test

      - name: Gerar relatório de cobertura (Jacoco)
        run: mvn -B jacoco:report

      - name: Publicar resultados dos testes
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Resultados dos Testes
          path: 'alexandria-backend/target/surefire-reports/*.xml'
          reporter: java-junit

      - name: Empacotar aplicação
        run: mvn -B package -DskipTests

      - name: Upload do artefato JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: alexandria-backend/target/*.jar

  docker-build:
    runs-on: ubuntu-latest
    needs: build   # só builda a imagem se o job "build" passar

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: ./alexandria-backend
          file: ./alexandria-backend/Dockerfile
          push: false
          tags: |
            alexandria-backend:${{ github.sha }}
            alexandria-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max