# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]


jobs:
  build:
    permissions:
      contents: read
      checks: write
      pull-requests: write
      
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alexandria-backend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: alexandria-backend/pom.xml

      - name: Build com Maven
        run: mvn -B clean compile

      - name: Rodar testes
        run: mvn -B test

      - name: Gerar relatório de cobertura (Jacoco)
        run: mvn -B jacoco:report

      - name: Publicar resultados dos testes
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Resultados dos Testes (Backend)
          path: 'alexandria-backend/target/surefire-reports/*.xml'
          reporter: java-junit

      - name: Empacotar aplicação
        run: mvn -B package -DskipTests

      - name: Upload do artefato JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: alexandria-backend/target/*.jar

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alexandria-frontend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: alexandria-frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Testes unitários (Vitest)
        run: npm run test -- --run

      - name: Build (Next.js)
        run: npm run build

  docker-build-backend:
    runs-on: ubuntu-latest
    needs: build   # só builda a imagem se o job "build" passar

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: ./alexandria-backend
          file: ./alexandria-backend/Dockerfile
          push: false
          tags: |
            alexandria-backend:${{ github.sha }}
            alexandria-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-frontend:
    runs-on: ubuntu-latest
    needs: frontend   # só builda a imagem se o job "frontend" passar

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem Docker (frontend)
        uses: docker/build-push-action@v6
        with:
          context: ./alexandria-frontend
          file: ./alexandria-frontend/Dockerfile
          push: false
          tags: |
            alexandria-frontend:${{ github.sha }}
            alexandria-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
