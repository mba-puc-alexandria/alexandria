apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: alexandria
  namespace: argocd
spec:
  project: 'default'
  source:
    helm: {}
    repoURL: 'https://github.com/mba-puc-alexandria/alexandria.git'
    targetRevision: feature/infracomargo
    path: alexandria-backend
  destination: 
    namespace: argocd
    server: 'https://kubernetes.daefault.svc'
  syncPolicy:
    automated: {}   
